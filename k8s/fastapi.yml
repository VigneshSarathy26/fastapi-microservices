apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
spec:
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: fastapi
        image: mailtovignesh/fastapi:24022026
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: secret
              key: DATABASE_URL
        - name: REDIS_URL
          value: "redis://redis-service:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
spec:
  selector:
    app: fastapi
  type: LoadBalancer
  ports:
  - port: 8000
    targetPort: 8000

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret
data:
  POSTGRES_DB: userdb
  POSTGRES_USER: root
  POSTGRES_PASSWORD: rC7_Bj9p0zmp1UhHfHOM
  DATABASE_URL: postgresql://root:rC7_Bj9p0zmp1UhHfHOM@postgres-service:5432/userdb